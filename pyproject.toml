[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "netbox-cisco-cer"
version = "0.1.0"
description = "NetBox plugin for Cisco Emergency Responder - manage Conventional ERLs from NetBox Site addresses"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
authors = [
    {name = "sieteunoseis", email = "jeremy.worden@gmail.com"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: Django",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
keywords = ["netbox", "cisco", "cer", "emergency-responder", "e911", "erl", "plugin"]
dependencies = [
    "requests>=2.28.0",
]

[project.urls]
Homepage = "https://github.com/sieteunoseis/netbox-cisco-cer"
Repository = "https://github.com/sieteunoseis/netbox-cisco-cer"
Issues = "https://github.com/sieteunoseis/netbox-cisco-cer/issues"
Changelog = "https://github.com/sieteunoseis/netbox-cisco-cer/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "black",
    "flake8",
    "isort",
    "pytest",
]

[tool.setuptools.packages.find]
include = ["netbox_cisco_cer*"]

[tool.setuptools.package-data]
netbox_cisco_cer = ["templates/**/*.html"]

[tool.black]
line-length = 120
target-version = ['py310', 'py311', 'py312']

[tool.isort]
profile = "black"
line_length = 120
